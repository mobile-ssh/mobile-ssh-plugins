<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Langflow</title>
  <style>
    body { margin:0; font:16px/1.45 system-ui,sans-serif; background:#1a1a2e; color:#eee; padding:16px;
           padding-bottom:max(16px,env(safe-area-inset-bottom)); }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#aaa; margin:4px 0 14px; font-size:14px; }
    button { width:100%; padding:14px; margin:6px 0; border:0; border-radius:10px; background:#DB2777; color:#fff; font-size:16px; }
    button.secondary { background:#3a3a52; }
    button:disabled { opacity:.5; }
    pre { background:#23233a; padding:10px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:34vh; overflow:auto; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>Langflow</h1>
  <p>Deploys Langflow — a visual LangChain flow builder — in Docker on the remote, bound to loopback.
     Open it here or in your phone's browser. Use the native Ollama components and set their Base URL to
     <code>http://host.docker.internal:11434</code> to reach your local model — no cloud keys.</p>
  <button id="setup">Install &amp; start Langflow</button>
  <button id="open" class="hidden">Open Langflow</button>
  <button id="open-ext" class="hidden secondary">Open in browser ↗</button>
  <pre id="log">Ready.</pre>
  <script src="./app.js"></script>
</body>
</html>
