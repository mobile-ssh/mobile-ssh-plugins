<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI Chat</title>
  <style>
    html,body { height:100%; }
    body { margin:0; display:flex; flex-direction:column; font:16px/1.45 system-ui,sans-serif;
           background:#1a1a2e; color:#eee; }
    header { padding:10px 14px; background:#23233a; font-weight:600; }
    header small { display:block; font-weight:400; color:#9a9ab0; font-size:12px; }
    #chat { flex:1; overflow:auto; padding:12px; }
    .msg { margin:8px 0; padding:10px 12px; border-radius:12px; max-width:88%; white-space:pre-wrap; word-break:break-word; }
    .me { background:#2196F3; color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
    .ai { background:#23233a; border-bottom-left-radius:3px; }
    .sys { color:#9a9ab0; font-size:13px; text-align:center; }
    form { display:flex; gap:8px; padding:10px; padding-bottom:max(10px,env(safe-area-inset-bottom)); background:#15151f; }
    input { flex:1; padding:12px; border-radius:10px; border:0; background:#23233a; color:#eee; font-size:16px; }
    button { padding:0 16px; border:0; border-radius:10px; background:#2196F3; color:#fff; font-size:16px; }
    button:disabled { opacity:.5; }
  </style>
</head>
<body>
  <header id="hdr">AI Chat<small id="sub" data-i18n="connecting">connecting…</small></header>
  <div id="chat"></div>
  <form id="f">
    <input id="in" data-i18n-ph="placeholder" placeholder="Message…" autocomplete="off" disabled />
    <button id="send" data-i18n="send" disabled>Send</button>
  </form>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
