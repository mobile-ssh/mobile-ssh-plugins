<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VS Code</title>
  <style>
    body { margin:0; font:16px/1.45 system-ui,sans-serif; background:#1a1a2e; color:#eee; padding:16px;
           padding-bottom:max(16px,env(safe-area-inset-bottom)); }
    h1 { font-size:18px; margin:0 0 4px; } p { color:#aaa; margin:4px 0 14px; font-size:14px; }
    button { width:100%; padding:14px; margin:6px 0; border:0; border-radius:10px; background:#2196F3; color:#fff; font-size:16px; }
    button.secondary { background:#23233a; color:#eee; } button:disabled { opacity:.5; }
    .cred { background:#23233a; border-radius:8px; padding:10px; margin:10px 0; font-family:monospace; word-break:break-all; }
    pre { background:#23233a; padding:10px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:34vh; overflow:auto; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1 id="title">VS Code</h1>
  <p data-i18n="desc">Installs code-server on the remote and opens the editor here. Run your agent in its terminal — it
     keeps running server-side across reconnects.</p>
  <button id="setup" data-i18n="setup_btn">Set up &amp; launch</button>
  <div id="ready" class="hidden">
    <button id="open" data-i18n="open_btn">Open VS Code</button>
    <button id="open-ext" class="secondary" data-i18n="open_ext">Open in browser ↗</button>
    <div class="cred"><span data-i18n="login_password">Login password:</span><br><b id="pw"></b></div>
  </div>
  <pre id="log" data-i18n="ready">Ready.</pre>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
