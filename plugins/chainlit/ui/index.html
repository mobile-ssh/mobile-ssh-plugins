<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chainlit Chat</title>
  <style>
    body { margin:0; font:16px/1.45 system-ui,sans-serif; background:#1a1a2e; color:#eee; padding:16px;
           padding-bottom:max(16px,env(safe-area-inset-bottom)); }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#aaa; margin:4px 0 14px; font-size:14px; }
    button { width:100%; padding:14px; margin:6px 0; border:0; border-radius:10px; background:#0EA5A4; color:#fff; font-size:16px; }
    button.secondary { background:#3a3a52; }
    button:disabled { opacity:.5; }
    pre { background:#23233a; padding:10px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:40vh; overflow:auto; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>Chainlit Chat</h1>
  <p>Run a Chainlit chat app (LlamaIndex over local Ollama) on the remote, bound to loopback.
     Open its web UI here or in your phone's browser. Shares the AI Chat plugin's Ollama. No cloud keys.</p>
  <button id="setup">Install &amp; start</button>
  <button id="open" class="hidden">Open Chainlit</button>
  <button id="open-ext" class="hidden secondary">Open in browser ↗</button>
  <pre id="log">Ready.</pre>
  <script src="./app.js"></script>
</body>
</html>
